apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-app
  namespace: blue-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-app
      version: green
  template:
    metadata:
      labels:
        app: blue-green-app
        version: green
    spec:
      containers:
        - name: green-container
          image: nginx:1.27
          ports:
            - containerPort: 80